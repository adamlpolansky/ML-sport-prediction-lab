name: synthetic-quality-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: synthetic-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m epl_probability_lab.demo --output-dir .qa/ci-demo
      - run: python -m epl_probability_lab.feature_demo --output-dir .qa/ci-feature-demo
      - run: python -m epl_probability_lab.publication --root .
